<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Управление сайтом</title>
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{--ink:#4a2a3a;--bg:#fdf1f5;--card:#fff;--acc:#e0749c;--line:#f0cdd9}
@media (prefers-color-scheme:dark){:root{--ink:#f6e3ea;--bg:#241a2c;--card:#34263e;--line:#4d3a5a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 110px}
h1{font-family:"Marck Script",cursive;font-weight:400;font-size:34px;margin:0;text-align:center;padding:18px 10px 4px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
label{display:block;font-size:13px;opacity:.7;margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=checkbox]{width:24px;height:24px}
input[type=date]{display:block;min-width:0;max-width:100%;height:46px;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left;min-height:1.2em}
textarea{min-height:150px}
.btn{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it:last-child{border:0}
.em{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;background:var(--line)}
.it .t{flex:1;min-width:0}.it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.it small{opacity:.6}
.ic{border:0;background:none;font-size:20px;padding:4px 6px;color:var(--ink);cursor:pointer}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.sw i{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw i.on{border-color:var(--ink)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + env(safe-area-inset-bottom,0));background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:center;z-index:20}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;display:none;padding:env(safe-area-inset-top,0) 0 40px}
.sheet.on{display:block}
#fsheet{z-index:25}#lsheet{z-index:26}#esheet{z-index:27}#act{z-index:28}#qs{z-index:29}
#msg{font-size:14px;text-align:center;min-height:20px}
.dirty{color:#d63a6a}
.undo{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:#2c1426;color:#fff;border-radius:14px;padding:10px 14px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 20px #0006}.undo.on{display:flex}.undo button{border:0;background:none;color:#ffb0c6;font:inherit;font-weight:700;cursor:pointer;padding:4px 8px}
.ph{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}
.ph div{position:relative;width:84px;height:84px;border-radius:10px;background-size:cover;background-position:center;background-color:var(--line)}
.ph b{position:absolute;top:-7px;right:-7px;background:#d63a6a;color:#fff;border-radius:50%;width:24px;height:24px;text-align:center;line-height:24px;font-weight:400;cursor:pointer}
.secs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.secs button{text-align:left;padding:12px}
.hint{font-size:13px;opacity:.65;margin-top:6px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.tabs .btn.on{background:var(--acc);color:#fff}
.tabs .btn:not(.on){background:transparent;color:var(--ink);border:1px solid var(--line)}
#login{max-width:360px;margin:60px auto;display:none}
#app{display:none}
#newPair{display:none;font-size:17px;background:#3d2e10;color:#fff;border-radius:14px;padding:12px;margin:10px 0}
</style>
</head>
<body>
<h1>Управление сайтом 💌</h1>

<div class="wrap">

 <div class="box" id="login">
  <b>Вход</b>
  <label>Логин</label><input id="llogin" autocomplete="username">
  <label>Пароль</label><input id="lpass" type="password" autocomplete="current-password">
  <div class="row" style="margin-top:12px"><button class="btn" id="lbtn">Войти</button></div>
  <div id="lerr" class="dirty" style="margin-top:8px"></div>
 </div>

 <div id="app">
  <div class="tabs">
   <button class="btn" id="tPairs">👥 Пары</button>
   <button class="btn" id="tSite">💌 Мой сайт</button>
   <a class="btn g" href="https://manovaum.ru/couple.html" target="_blank" rel="noopener">Открыть сайт ↗</a>
   <button class="btn g" id="out">⎋ Выйти</button>
  </div>

  <div id="pairsBox" style="display:none">
   <div class="box">
    <b>Пары</b>
    <div class="row" style="margin-top:10px"><button class="btn" id="create">＋ Создать новую пару</button></div>
    <div id="newPair"></div>
    <div id="pairList" style="margin-top:8px"></div>
   </div>
  </div>

  <div id="siteBox" style="display:none">
   <div class="box">
    <b>Настройки сайта</b>
    <label>Заголовок</label><input id="cTitle">
    <label>Подзаголовок</label><input id="cSub">
    <label>Дата начала отношений (счётчик дней и годовщина)</label><input id="cStart" type="date">
    <label>Дата следующей встречи (отсчёт «До встречи»)</label><input id="cMeet" type="date">
    <label>Сообщение в конце квиза</label><input id="cQuizEnd">
    <label>Код входа (пусто = не менять, «-» = убрать код)</label><input id="cPin" placeholder="например 1402">
    <label>Музыка (ссылка на mp3 или оставь пустым)</label><input id="cMus">
   </div>
   <button class="btn" id="actBtn" style="width:100%;margin-top:12px">📬 Активность</button>
   <button class="btn g" id="qBtn" style="width:100%;margin-top:8px">💬 Вопрос дня</button>
   <div class="box" id="list"></div>
   <div class="row"><button class="btn" id="add" style="flex:1">＋ Новое письмо</button><button class="btn g" id="months" style="flex:1">🗓 Письма на 12 месяцев</button></div>
   <div class="box"><b>Разделы сайта</b><div class="secs" id="secs" style="margin-top:10px"></div><div class="hint">Раздел появляется на сайте, когда в нём есть хотя бы одна запись.</div></div>
  </div>
 </div>
</div>

<div class="undo" id="undo"><span id="undoT"></span><button id="undoB">Отменить</button></div>
<div class="bar" id="bar" style="display:none"><span id="msg"></span><button class="btn" id="pub">Опубликовать на сайте</button></div>

<div class="sheet" id="fsheet"><div class="wrap">
 <h1 id="fT0">Письмо</h1>
 <div class="box">
  <div class="row"><div style="width:90px"><label>Эмодзи</label><input id="fE" maxlength="4"></div><div style="flex:1;min-width:160px"><label>Заголовок конверта</label><input id="fT"></div></div>
  <label>Текст письма (пустая строка = новый абзац)</label><textarea id="fX" style="min-height:240px"></textarea>
  <label>Цвет конверта</label><div class="sw" id="fC"></div>
  <label>Тип</label><select id="fY"><option value="">Обычное</option><option value="hug">С анимацией объятий</option><option value="secret">Секретное (золотое)</option></select>
  <label>Фон бумаги</label><select id="fB"><option value="">Обычный</option><option value="sakura">Сакура</option><option value="stars">Звёздное небо</option><option value="snow">Снег</option><option value="sunset">Закат</option><option value="mint">Мята</option></select>
  <label>Секрет под печатью (появится, если нажать на печать 5 раз)</label><input id="fS">
  <label>Откроется только с даты (пусто = сразу)</label><input id="fU" type="date">
  <label>Фото в письме</label><div class="ph" id="fP"></div><button class="btn g" id="fPb" type="button">＋ Добавить фото</button><div id="fPs" class="hint"></div>
 </div>
 <div class="row" style="justify-content:center;gap:12px"><button class="btn g" id="fCancel">Отмена</button><button class="btn" id="fOk">Готово</button></div>
</div></div>

<div class="sheet" id="lsheet"><div class="wrap">
 <h1 id="lT"></h1><div class="box" id="lList"></div>
 <div class="row" style="justify-content:center;gap:12px"><button class="btn g" id="lBack">Назад</button><button class="btn" id="lAdd">＋ Добавить</button></div>
</div></div>

<div class="sheet" id="esheet"><div class="wrap">
 <h1 id="eT">Запись</h1><div class="box" id="eForm"></div>
 <div class="row" style="justify-content:center;gap:12px"><button class="btn g" id="eCancel">Отмена</button><button class="btn" id="eOk">Готово</button></div>
</div></div>

<div class="sheet" id="act"><div class="wrap">
 <h1>Активность 📬</h1><div class="box" id="actSum"></div><div class="box" id="actList"></div>
 <div class="row" style="justify-content:center;gap:12px"><button class="btn g" id="actBack">Назад</button><button class="btn" id="actRef">Обновить</button></div>
</div></div>

<div class="sheet" id="qs"><div class="wrap">
 <h1>Вопрос дня 💬</h1><div class="box" id="qBody"></div>
 <div class="row" style="justify-content:center;gap:12px"><button class="btn g" id="qBack">Назад</button><button class="btn" id="qRef">Обновить</button></div>
</div></div>

<input id="file" type="file" accept="image/*" multiple style="display:none">

<script type="module">
const $=id=>document.getElementById(id);

/* ---------- связь с API (ключей в браузере нет) ---------- */
const API='https://api.manovaum.ru';
const TK='ow_session_token';
const tok=()=>localStorage.getItem(TK);
const devId=()=>'';
const ERR={
  invalid_credentials:'Неверный логин или пароль',
  blocked:'Эта пара заблокирована',
  too_many_devices:'Уже открыто на двух устройствах. Выйди на одном из них',
  too_many_attempts:'Слишком много попыток. Подожди 15 минут'
};
async function post(path,body){
  const r=await fetch(API+path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const d=await r.json().catch(()=>null);
  if(!r.ok){const e=new Error((d&&d.message)||r.status);e.code=d&&d.message;throw e}
  return d;
}
async function rpc(fn,args){
  const a={...(args||{})};delete a.p_token;delete a.p_device;
  if(fn==='login_couple'){const d=await post('/login',{login:a.p_login,password:a.p_password});return [{session_token:'cookie',admin_flag:!!d.isAdmin}]}
  if(fn==='logout_couple')return post('/logout',{});
  return post('/rpc/'+fn,a);
}
const call=(fn,args={})=>rpc(fn,args);

const PAL=[['#fbd3de','#f4b6c8'],['#e4d9fa','#d3c2f3'],['#ffe7c9','#fdd2a8'],['#fbc9cf','#f2a3ae'],['#cfd9f5','#b8c6ee'],['#d3eee3','#bfe3d3'],['#fcd5e8','#f7b8d7'],['#fff0b8','#f5d77a']];
const SCH={
 timeline:{t:'📖 История',f:[['date','Дата','date'],['title','Заголовок'],['text','Описание','area'],['photo','Фото','photo']]},
 coupons:{t:'🎟 Купоны',f:[['emoji','Эмодзи'],['title','Название'],['text','Условия','area']]},
 checklist:{t:'✅ Список мечт',f:[['text','Что сделать'],['done','Уже сделано','check']]},
 gallery:{t:'🖼 Альбом',f:[['photo','Фото','photo'],['caption','Подпись']]},
 quiz:{t:'❓ Квиз',f:[['q','Вопрос'],['options','Варианты ответов (каждый с новой строки)','lines'],['answer','Номер правильного ответа','number']]},
 playlist:{t:'🎵 Плейлист',f:[['title','Название песни'],['artist','Исполнитель'],['url','Ссылка на трек, альбом или плейлист из Яндекс Музыки','area']]},
 questions:{t:'💬 Вопросы дня',f:[['q','Вопрос']]},
 dates:{t:'🎡 Рулетка свиданий',f:[['text','Идея свидания']]},
 quest:{t:'🗝 Квест',f:[['riddle','Загадка','area'],['answer','Ответ (несколько вариантов через |)'],['hint','Награда или подсказка после ответа','area']]},
 scratch:{t:'🪄 Скретч-карты',f:[['title','Заголовок'],['text','Что под защитным слоем','area']]},
 puzzle:{t:'🧩 Пазл из фото',f:[['photo','Фото (лучше квадратное)','photo'],['text','Послание после сборки','area']]},
 places:{t:'🗺 Наши места',f:[['title','Название'],['coords','Координаты (например 55.7558, 37.6173)'],['text','Описание','area'],['photo','Фото','photo']]},
 holidays:{t:'🎉 Особые даты',f:[['date','Дата (повторяется каждый год)','date'],['emoji','Эмодзи'],['title','Заголовок'],['text','Поздравление','area']]}
};
const SET={cTitle:'title',cSub:'subtitle',cStart:'startDate',cMeet:'meetDate',cQuizEnd:'quizEnd',cMus:'music'};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ow:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const qid=x=>x.id||('h'+[...String(x.q)].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7).toString(36));

let data=null,dirty=false,editIdx=-1,col=0,curPhotos=[],secKey=null,secIdx=-1,secVals={},EV=[],stats={},undoT;
const imgCache={};
const say=(t,bad)=>{$('msg').textContent=t;$('msg').className=bad?'dirty':''};
const mark=()=>{dirty=true;say('Есть неопубликованные изменения',1)};
async function getImg(p){if(!p)return '';if(p.startsWith('data:'))return p;if(!p.startsWith('media:'))return '';const id=p.slice(6);if(!imgCache[id])imgCache[id]=call('get_media',{p_id:id}).catch(()=>'');return imgCache[id]}
window.onbeforeunload=()=>dirty?'Есть неопубликованные изменения':undefined;

/* ---------- вход и вкладки ---------- */
$('lbtn').onclick=async()=>{$('lerr').textContent='';
 try{const rows=await rpc('login_couple',{p_login:$('llogin').value.trim(),p_password:$('lpass').value});
  localStorage.setItem(TK,rows[0].session_token);localStorage.setItem('ow_is_admin',rows[0].admin_flag?'1':'0');start()}
 catch(e){$('lerr').textContent=ERR[e.code]||e.message}};
$('lpass').onkeydown=e=>{if(e.key==='Enter')$('lbtn').click()};
$('out').onclick=async()=>{await call('logout_couple').catch(()=>{});localStorage.removeItem(TK);localStorage.removeItem('ow_is_admin');location.reload()};
function start(){if(!tok()){$('login').style.display='block';return}
 $('login').style.display='none';$('app').style.display='block';
 const adm=localStorage.getItem('ow_is_admin')==='1';$('tPairs').style.display=adm?'':'none';
 showTab(adm?'pairs':'site')}
function showTab(t){$('pairsBox').style.display=t==='pairs'?'block':'none';$('siteBox').style.display=t==='site'?'block':'none';
 $('tPairs').classList.toggle('on',t==='pairs');$('tSite').classList.toggle('on',t==='site');
 if(t==='pairs')loadPairs();else loadSite()}
$('tPairs').onclick=()=>showTab('pairs');
$('tSite').onclick=()=>showTab('site');

/* ---------- пары (владелец) ---------- */
/* ---------- пары (владелец) ---------- */
async function loadPairs(){const L=$('pairList');L.textContent='Загружаю…';
 try{const rows=await call('admin_list_couples');L.innerHTML='';
  rows.forEach(r=>{const d=document.createElement('div');d.className='it';
   const st=r.couple_is_admin?'владелец':r.couple_is_blocked?'заблокирована':'активна';
   d.innerHTML=`<div class="t"><b>${esc(r.couple_label||r.couple_login)}</b><small>${esc(r.couple_login)} · ${st} · входов ${r.couple_login_count} · устройств сейчас ${r.couple_active_devices} · создана ${new Date(r.couple_created_at).toLocaleDateString('ru-RU')}</small></div>`;
   const ren=document.createElement('button');ren.className='btn g';ren.textContent='Переименовать';
   ren.onclick=async()=>{const n=prompt('Новое название пары',r.couple_label||'');if(n===null||!n.trim())return;
    try{await call('admin_rename_couple',{p_couple:r.couple_id,p_label:n.trim()});loadPairs()}catch(e){alert('Не получилось: '+e.message)}};
   d.append(ren);
   if(!r.couple_is_admin){
    const bb=document.createElement('button');bb.className='btn g';bb.textContent=r.couple_is_blocked?'Разблокировать':'Заблокировать';
    bb.onclick=async()=>{try{await call('admin_set_blocked',{p_couple:r.couple_id,p_blocked:!r.couple_is_blocked});loadPairs()}catch(e){alert('Не получилось: '+e.message)}};
    const db=document.createElement('button');db.className='btn g';db.textContent='Удалить';
    db.onclick=async()=>{if(!confirm('Удалить пару '+(r.couple_label||r.couple_login)+' и все её данные?'))return;
     try{await call('admin_delete_couple',{p_couple:r.couple_id});loadPairs()}catch(e){alert('Не удалилось: '+e.message)}};
    d.append(bb,db)}
   L.appendChild(d)})}
 catch(e){L.textContent='Ошибка: '+e.message}}
$('create').onclick=async()=>{const n=prompt('Название пары (например, «Аня и Миша»)');if(n===null)return;
 try{const [p]=await call('admin_create_couple',{p_label:n.trim()});const N=$('newPair');N.style.display='block';
  N.innerHTML=`<b>Новая пара создана</b><br>Название: <b>${esc(n.trim()||'Без названия')}</b><br>Логин: <b>${esc(p.out_login)}</b><br>Пароль: <b>${esc(p.out_password)}</b><br><small>Пароль показывается один раз. Скопируй и отправь паре.</small>`;loadPairs()}
 catch(e){alert('Не получилось: '+e.message)}};

/* ---------- сайт: загрузка и публикация ---------- */
async function loadSite(){say('Загружаю…');
 try{const j=await call('get_site');data={config:j.config||{},letters:j.letters||[]};
  Object.keys(SCH).forEach(k=>data.config[k]=data.config[k]||[]);
  fill();drawSecs();draw();dirty=false;say('Загружено ✓');$('bar').style.display='flex';loadEv()}
 catch(e){say('Не загрузилось: '+e.message,1)}}
function fill(){Object.entries(SET).forEach(([i,k])=>$(i).value=data.config[k]||'');$('cPin').value=''}
$('pub').onclick=async()=>{if(!data)return;const c=data.config;
 Object.entries(SET).forEach(([i,k])=>c[k]=$(i).value.trim());
 const p=$('cPin').value.trim();if(p==='-')c.pinHash='';else if(p)c.pinHash=await sha(p);
 say('Сохраняю…');
 try{await call('save_site',{p_site:data});dirty=false;$('cPin').value='';say('Опубликовано ✓ Обнови страницу сайта, чтобы увидеть изменения')}
 catch(e){say('Не сохранилось: '+e.message,1)}};
['cTitle','cSub','cStart','cMeet','cQuizEnd','cMus','cPin'].forEach(i=>$(i).oninput=mark);

/* ---------- письма ---------- */
function draw(){const L=$('list');L.innerHTML='<b>Письма</b>';
 data.letters.forEach((l,i)=>{const d=document.createElement('div');d.className='it';
  d.innerHTML=`<div class="em" style="background:${esc(l.c||'#fbd3de')}">${esc(l.emoji)}</div><div class="t"><b>${esc(l.title)}</b><small>${l.type==='secret'?'секретное':l.type==='hug'?'объятия':'обычное'}${l.unlock?' · с '+esc(l.unlock):''}${(l.photos&&l.photos.length)?' · фото '+l.photos.length:''}${statStr(l.id)}</small></div><button class="ic" data-a="up">▲</button><button class="ic" data-a="dn">▼</button><button class="ic" data-a="ed">✏️</button><button class="ic" data-a="rm">🗑</button>`;
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>act(data.letters,b.dataset.a,i,()=>edit(i),draw,b));L.appendChild(d)})}
function undoBar(t,fn){clearTimeout(undoT);$('undoT').textContent=t;$('undo').classList.add('on');$('undoB').onclick=()=>{clearTimeout(undoT);$('undo').classList.remove('on');fn()};undoT=setTimeout(()=>$('undo').classList.remove('on'),6000)}
function arm(btn,txt){if(btn.dataset.arm)return true;const old=btn.textContent;btn.dataset.arm='1';btn.textContent=txt;btn.style.cssText='font-size:14px;color:#fff;background:#d63a6a;border-radius:999px;padding:6px 10px';
 setTimeout(()=>{if(btn.isConnected){delete btn.dataset.arm;btn.textContent=old;btn.style.cssText=''}},3000);return false}
function act(A,a,i,editFn,redraw,btn){
 if(a==='up'&&i>0)[A[i-1],A[i]]=[A[i],A[i-1]];
 if(a==='dn'&&i<A.length-1)[A[i+1],A[i]]=[A[i],A[i+1]];
 if(a==='rm'){const it=A.splice(i,1)[0];undoBar('Удалено',()=>{A.splice(Math.min(i,A.length),0,it);mark();redraw()})}
 if(a==='ed')return editFn();
 mark();redraw()}
$('add').onclick=()=>edit(-1);
$('months').onclick=()=>{if(!arm($('months'),'Точно добавить 12 писем?'))return;delete $('months').dataset.arm;const n=new Date();
 for(let k=1;k<=12;k++){const d=new Date(n.getFullYear(),n.getMonth()+k,1);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  data.letters.push({id:'m'+Date.now()+k,emoji:'🗓',title:'Открой '+d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'}),text:'Напиши письмо на этот месяц ✍️',c:PAL[k%PAL.length][0],c2:PAL[k%PAL.length][1],type:'',unlock:iso,photos:[]})}
 mark();draw()};

function edit(i){editIdx=i;const l=i>=0?data.letters[i]:{emoji:'💌',title:'Открой, когда…',text:'',c:PAL[0][0],c2:PAL[0][1],type:'',unlock:'',photos:[],bg:''};
 $('fT0').textContent=i>=0?'Редактирование':'Новое письмо';$('fE').value=l.emoji;$('fT').value=l.title;$('fX').value=l.text;$('fY').value=l.type||'';$('fB').value=l.bg||'';$('fU').value=l.unlock||'';$('fS').value=l.secretMsg||'';
 col=Math.max(0,PAL.findIndex(p=>p[0]===l.c));$('fC').innerHTML=PAL.map((p,k)=>`<i data-k="${k}" class="${k===col?'on':''}" style="background:linear-gradient(135deg,${p[0]},${p[1]})"></i>`).join('');
 $('fC').querySelectorAll('i').forEach(e=>e.onclick=()=>{col=+e.dataset.k;$('fC').querySelectorAll('i').forEach(x=>x.classList.toggle('on',x===e))});
 curPhotos=(l.photos||[]).map(p=>({path:p,prev:''}));drawPh();$('fPs').textContent='';$('fsheet').classList.add('on');window.scrollTo(0,0)}
$('fCancel').onclick=()=>$('fsheet').classList.remove('on');
$('fOk').onclick=()=>{const l={id:editIdx>=0?data.letters[editIdx].id:'l'+Date.now(),emoji:$('fE').value||'💌',title:$('fT').value||'Открой, когда…',text:$('fX').value,c:PAL[col][0],c2:PAL[col][1],type:$('fY').value,bg:$('fB').value,secretMsg:$('fS').value.trim(),unlock:$('fU').value,photos:curPhotos.map(x=>x.path)};
 if(editIdx>=0)data.letters[editIdx]=l;else data.letters.push(l);$('fsheet').classList.remove('on');mark();draw()};
async function drawPh(){const P=$('fP');P.innerHTML='';for(let i=0;i<curPhotos.length;i++){const x=curPhotos[i];if(!x.prev)x.prev=await getImg(x.path);
 const d=document.createElement('div');d.style.backgroundImage=`url(${x.prev})`;const b=document.createElement('b');b.textContent='✕';b.onclick=()=>{curPhotos.splice(i,1);drawPh()};d.appendChild(b);P.appendChild(d)}}

/* ---------- загрузка фото ---------- */
function shrink(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82))};im.onerror=()=>no(new Error('Не удалось прочитать фото'));im.src=u})}
function pickPhotos(multi,status,onEach){const f=$('file');f.multiple=multi;f.onchange=async e=>{const fs=[...e.target.files];e.target.value='';let n=0;
 for(const file of fs){n++;status(`Загружаю фото ${n} из ${fs.length}…`);
  try{const url=await shrink(file);const id=await call('add_media',{p_data:url});imgCache[id]=url;onEach({path:'media:'+id,prev:url})}
  catch(err){status('Не загрузилось: '+(err.message==='too_big'?'фото слишком большое':err.message));return}}
 status('Фото загружены ✓ Нажми «Готово», потом «Опубликовать на сайте»')};f.click()}
$('fPb').onclick=()=>pickPhotos(true,t=>$('fPs').textContent=t,x=>{curPhotos.push(x);drawPh()});

/* ---------- разделы ---------- */
function drawSecs(){$('secs').innerHTML='';Object.entries(SCH).forEach(([k,s])=>{const b=document.createElement('button');b.className='btn g';b.textContent=`${s.t} (${data.config[k].length})`;b.onclick=()=>openList(k);$('secs').appendChild(b)})}
const itemTitle=x=>x.title||x.text||x.q||x.caption||'—';
function openList(k){secKey=k;$('lT').textContent=SCH[k].t;drawList();$('lsheet').classList.add('on');window.scrollTo(0,0)}
function drawList(){const A=data.config[secKey],L=$('lList');L.innerHTML=A.length?'':'<div class="hint">Пока пусто. Нажми «Добавить».</div>';
 A.forEach((x,i)=>{const d=document.createElement('div');d.className='it';
  d.innerHTML=`<div class="em">${x.photo?'🖼':esc(x.emoji||'•')}</div><div class="t"><b>${esc(itemTitle(x))}</b><small>${esc(x.date||x.artist||'')}${x.done?' ✓ сделано':''}</small></div><button class="ic" data-a="up">▲</button><button class="ic" data-a="dn">▼</button><button class="ic" data-a="ed">✏️</button><button class="ic" data-a="rm">🗑</button>`;
  d.querySelectorAll('button').forEach(b=>b.onclick=()=>act(A,b.dataset.a,i,()=>editItem(i),()=>{drawList();drawSecs()},b));L.appendChild(d)})}
$('lBack').onclick=()=>{$('lsheet').classList.remove('on');drawSecs()};
$('lAdd').onclick=()=>editItem(-1);
function editItem(i){secIdx=i;const A=data.config[secKey],x=i>=0?A[i]:{};secVals={...x};const F=$('eForm');F.innerHTML='';
 SCH[secKey].f.forEach(([k,l,t])=>{const w=document.createElement('div');w.innerHTML=`<label>${l}</label>`;let el;
  if(t==='area'||t==='lines'){el=document.createElement('textarea');el.value=t==='lines'?(x[k]||[]).join('\n'):(x[k]||'')}
  else if(t==='check'){el=document.createElement('input');el.type='checkbox';el.checked=!!x[k]}
  else if(t==='photo'){const pv=document.createElement('div');pv.className='ph';const st=document.createElement('div');st.className='hint';
   const draw1=async()=>{pv.innerHTML='';if(secVals[k]){const d=document.createElement('div');d.style.backgroundImage=`url(${await getImg(secVals[k])})`;const b=document.createElement('b');b.textContent='✕';b.onclick=()=>{secVals[k]='';draw1()};d.appendChild(b);pv.appendChild(d)}};draw1();
   const b=document.createElement('button');b.type='button';b.className='btn g';b.textContent='＋ Выбрать фото';b.onclick=()=>pickPhotos(false,s=>st.textContent=s,p=>{secVals[k]=p.path;draw1()});
   w.append(pv,b,st);F.appendChild(w);return}
  else{el=document.createElement('input');el.type=t==='date'?'date':t==='number'?'number':'text';el.value=x[k]==null?'':x[k]}
  el.dataset.k=k;el.dataset.t=t||'';w.appendChild(el);F.appendChild(w)});
 $('eT').textContent=i>=0?'Редактирование':'Новая запись';$('esheet').classList.add('on');window.scrollTo(0,0)}
$('eCancel').onclick=()=>$('esheet').classList.remove('on');
$('eOk').onclick=()=>{const o={id:secVals.id||'i'+Date.now()};
 SCH[secKey].f.forEach(([k,l,t])=>{if(t==='photo'){o[k]=secVals[k]||'';return}const el=$('eForm').querySelector(`[data-k="${k}"]`);
  o[k]=t==='check'?el.checked:t==='lines'?el.value.split('\n').map(s=>s.trim()).filter(Boolean):t==='number'?(+el.value||1):el.value.trim()});
 const A=data.config[secKey];if(secIdx>=0)A[secIdx]=o;else A.push(o);$('esheet').classList.remove('on');mark();drawList();drawSecs()};

/* ---------- вопрос дня (ответ с этой стороны) ---------- */
async function drawQa(){const B=$('qBody'),Q=data.config.questions||[];
 if(!Q.length){B.textContent='Добавь вопросы: «Разделы сайта» → 💬 Вопросы дня';return}
 B.textContent='Загружаю…';let D={};
 try{(await call('qa_get')).forEach(r=>{(D[r.out_qid]=D[r.out_qid]||{})[r.out_who]={text:r.out_text}})}
 catch(e){B.textContent='Не получилось: '+e.message;return}
 B.innerHTML=Q.map((x,i)=>{const a=D[qid(x)]||{};let h=`<div class="it" style="display:block"><b>${esc(x.q)}</b>`;
  if(!a.him)h+=(a.her?'<div class="hint">Она уже ответила 💗</div>':'')+`<textarea data-i="${i}" style="min-height:80px;margin-top:6px"></textarea><div style="margin-top:6px"><button class="btn" data-s="${i}">Отправить</button></div>`;
  else h+=`<label>Твой ответ</label><div>${esc(a.him.text)}</div><label>Её ответ</label><div>${a.her?esc(a.her.text):'Она ещё не ответила'}</div>`;
  return h+'</div>'}).join('');
 B.querySelectorAll('button[data-s]').forEach(b=>b.onclick=async()=>{const i=+b.dataset.s,t=B.querySelector(`textarea[data-i="${i}"]`).value.trim();if(!t)return;
  try{await call('qa_put',{p_qid:qid(Q[i]),p_who:'him',p_text:t});drawQa()}
  catch(e){b.insertAdjacentHTML('afterend',`<div class="dirty">Не отправилось: ${esc(e.message)}</div>`)}})}
$('qBtn').onclick=()=>{$('qs').classList.add('on');window.scrollTo(0,0);drawQa()};
$('qBack').onclick=()=>$('qs').classList.remove('on');
$('qRef').onclick=drawQa;

/* ---------- активность ---------- */
const when=t=>new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const seen=()=>+(localStorage.getItem('ow_seen')||0);
function calcStats(){stats={};EV.forEach(e=>{const s=stats[e.l]=stats[e.l]||{o:0,r:0,x:[],p:0};if(e.k==='open')s.o++;if(e.k==='read')s.r++;if(e.k==='react')s.x.push(e.d);if(e.k==='reply')s.p++})}
function statStr(id){const s=stats[id];if(!s||!s.o)return ' · не открыто';return ' · 👁'+s.o+(s.r?' ✔ прочитано':'')+(s.x.length?' '+[...new Set(s.x)].join(''):'')+(s.p?' ✍️'+s.p:'')}
function badge(){const n=EV.filter(e=>e.t>seen()).length;$('actBtn').textContent='📬 Активность'+(n?` (+${n})`:'')}
async function loadEv(){try{const rows=await call('get_events',{p_limit:300});EV=rows.map(r=>({k:r.kind,l:r.letter_id,n:r.name,d:r.detail,t:new Date(r.created_at).getTime()}));calcStats();draw();badge();return true}
 catch(e){say('Активность не загрузилась: '+e.message,1);return false}}
function evText(e){const n=`«${esc(e.n)}»`;return({open:`👁 открыла ${n}`,read:`✔ дочитала ${n}`,react:`${esc(e.d)} реакция на ${n}`,reply:`✍️ ответила на ${n}:<br><b>${esc(e.d)}</b>`,coupon:`🎟 использовала купон «${esc(e.d)}»`,todo:`✅ ${esc(e.d)}`,quiz:`❓ квиз: ${esc(e.d)}`,ping:esc(e.d),mood:`🙂 настроение: ${esc(e.d)}`,qa:`💬 вопрос дня: ${esc(e.d)}`,roulette:`🎡 выпало: ${esc(e.d)}`,quest:`🗝 квест: ${esc(e.d)}`,scratch:`🪄 стёрла: ${esc(e.d)}`,puzzle:`🧩 ${esc(e.d)}`,secret:`🤫 нашла секрет на ${n}`})[e.k]||esc(e.k)}
function drawAct(){const op=new Set(EV.filter(e=>e.k==='open').map(e=>e.l)),rd=new Set(EV.filter(e=>e.k==='read').map(e=>e.l));
 $('actSum').innerHTML=`Открыто писем: <b>${[...op].filter(i=>data.letters.some(l=>l.id===i)).length}</b> из ${data.letters.length} · дочитано: <b>${rd.size}</b> · ответов: <b>${EV.filter(e=>e.k==='reply').length}</b>`;
 $('actList').innerHTML=EV.length?EV.slice(0,120).map(e=>`<div class="it"><div class="t" style="white-space:normal"><small>${when(e.t)}</small><div>${evText(e)}</div></div></div>`).join(''):'<div class="hint">Пока ничего нет.</div>'}
$('actBtn').onclick=async()=>{await loadEv();drawAct();localStorage.setItem('ow_seen',String(Date.now()));badge();$('act').classList.add('on');window.scrollTo(0,0)};
$('actBack').onclick=()=>$('act').classList.remove('on');
$('actRef').onclick=async()=>{await loadEv();drawAct()};

start();
</script>
