<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Открой, когда…</title>
<style>
  body { margin:0; min-height:100vh; font-family:system-ui,sans-serif;
         background:linear-gradient(160deg,#ffd6e4,#e6d6ff); color:#5a2440;
         display:flex; flex-direction:column; align-items:center; padding:24px; box-sizing:border-box; }
  h1 { font-family:'Marck Script',cursive; font-weight:400; color:#c03a6a; margin:24px 0 8px; }
  .card { background:#fff8; border-radius:16px; padding:20px; width:100%; max-width:360px;
          box-shadow:0 8px 24px #0002; margin-top:16px; box-sizing:border-box; }
  input { width:100%; padding:10px; margin:6px 0 12px; border:1px solid #e0a0b8; border-radius:10px;
          font-size:16px; box-sizing:border-box; }
  button.main { width:100%; padding:12px; border:0; border-radius:999px; background:#e06a95;
                color:#fff; font-size:16px; cursor:pointer; }
  button.link { background:none; border:0; color:#c03a6a; cursor:pointer; text-decoration:underline; margin-top:8px; }
  .msg { color:#b0234f; min-height:20px; margin-top:8px; font-size:14px; }
  .letter { background:#fff; border-radius:12px; padding:12px; margin-top:12px; }
  .letter small { color:#8a5a70; }
  .hidden { display:none; }
  footer { margin-top:auto; padding-top:24px; }
</style>
</head>
<body>

<h1>Открой, когда… 💌</h1>

<!-- Выбор -->
<div id="screen-start" class="card">
  <button class="main" onclick="show('screen-pair-login')">Войти</button>
  <div style="height:10px"></div>
  <button class="main" onclick="show('screen-register')">Регистрация</button>
</div>

<!-- Вход в пару -->
<div id="screen-pair-login" class="card hidden">
  <h3>Вход в пару</h3>
  <label>Логин пары</label>
  <input id="pl-login" autocomplete="username">
  <label>Пароль</label>
  <input id="pl-pass" type="password" autocomplete="current-password">
  <button class="main" onclick="pairLogin()">Войти</button>
  <div class="msg" id="pl-msg"></div>
  <button class="link" onclick="show('screen-start')">Назад</button>
</div>

<!-- Регистрация владельца -->
<div id="screen-register" class="card hidden">
  <h3>Регистрация</h3>
  <label>Логин (латиница, цифры, _)</label>
  <input id="rg-login" autocomplete="username">
  <label>Пароль (минимум 8 символов)</label>
  <input id="rg-pass" type="password" autocomplete="new-password">
  <label>Email (необязательно)</label>
  <input id="rg-email" type="email">
  <button class="main" onclick="register()">Создать аккаунт</button>
  <div class="msg" id="rg-msg"></div>
  <button class="link" onclick="show('screen-start')">Назад</button>
</div>

<!-- Мой кабинет владельца -->
<div id="screen-owner" class="card hidden">
  <h3>Мой кабинет</h3>
  <p style="font-size:14px">Создайте пару: логин и пароль, которые получит второй человек.</p>
  <label>Логин пары (латиница, цифры, _, -)</label>
  <input id="cp-login">
  <label>Пароль пары (минимум 8 символов)</label>
  <input id="cp-pass" type="password" autocomplete="new-password">
  <button class="main" onclick="createCouple()">Создать пару</button>
  <div class="msg" id="cp-msg"></div>
  <button class="link" onclick="logout()">Выйти</button>
</div>

<!-- Письма пары -->
<div id="screen-letters" class="card hidden">
  <h3>Письма</h3>
  <button class="main" onclick="loadLetters()">Обновить</button>
  <div id="letters"></div>
  <div class="msg" id="lt-msg"></div>
  <button class="link" onclick="logout()">Выйти</button>
</div>

<footer></footer>

<script>
const API = 'https://api.otkroikogda.ru';

function show(id) {
  ['screen-start','screen-pair-login','screen-register','screen-owner','screen-letters']
    .forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
}

async function call(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {})
  });
  let data = {};
  try { data = await r.json(); } catch (e) {}
  return { status: r.status, data };
}

const MESSAGES = {
  invalid_credentials: 'Неверный логин или пароль',
  login_taken: 'Такой логин уже занят',
  invalid_login: 'Логин: латиница, цифры, _, от 3 до 32 символов',
  weak_password: 'Пароль минимум 8 символов',
  invalid_email: 'Некорректный email',
  unauthorized: 'Сессия не найдена, войдите заново',
  limit_reached: 'Достигнут лимит тарифа'
};

async function pairLogin() {
  const msg = document.getElementById('pl-msg');
  msg.textContent = '';
  const { status, data } = await call('/rpc/couple_login', {
    login: document.getElementById('pl-login').value,
    password: document.getElementById('pl-pass').value
  });
  if (status === 200) { show('screen-letters'); loadLetters(); }
  else msg.textContent = MESSAGES[data.message] || 'Ошибка входа';
}

async function register() {
  const msg = document.getElementById('rg-msg');
  msg.textContent = '';
  const login = document.getElementById('rg-login').value.trim().toLowerCase();
  const password = document.getElementById('rg-pass').value;
  const email = document.getElementById('rg-email').value;

  const reg = await call('/register', { login, password, email });
  if (reg.status !== 201) {
    msg.textContent = MESSAGES[reg.data.message] || 'Ошибка регистрации';
    return;
  }
  // Сразу входим под новым аккаунтом, чтобы не просить вводить логин заново
  const log = await call('/login', { login, password });
  if (log.status === 200) {
    document.getElementById('rg-pass').value = '';
    show('screen-owner');
  } else {
    msg.textContent = 'Аккаунт создан, но вход не выполнен. Нажмите Назад и войдите.';
  }
}

async function createCouple() {
  const msg = document.getElementById('cp-msg');
  msg.textContent = '';
  const login = document.getElementById('cp-login').value.trim().toLowerCase();
  const password = document.getElementById('cp-pass').value;
  const { status, data } = await call('/rpc/couple_create', { login, password });
  if (status === 201) {
    msg.style.color = '#2e7d4f';
    msg.textContent = 'Пара создана. Логин: ' + login + '. Передайте логин и пароль второму человеку.';
    document.getElementById('cp-login').value = '';
    document.getElementById('cp-pass').value = '';
  } else {
    msg.style.color = '#b0234f';
    msg.textContent = MESSAGES[data.message] || 'Не удалось создать пару';
  }
}

async function loadLetters() {
  const box = document.getElementById('letters');
  const msg = document.getElementById('lt-msg');
  msg.textContent = '';
  const { status, data } = await call('/rpc/letters_list', {});
  if (status !== 200) { msg.textContent = MESSAGES[data.message] || 'Не удалось загрузить письма'; return; }
  box.innerHTML = '';
  if (!data.letters.length) { box.textContent = 'Писем пока нет.'; return; }
  for (const l of data.letters) {
    const div = document.createElement('div');
    div.className = 'letter';
    div.innerHTML = '<b></b><div></div><small></small>';
    div.querySelector('b').textContent = l.title;
    div.querySelector('div').textContent = l.body;
    div.querySelector('small').textContent = l.open_when ? 'Открыть: ' + l.open_when : '';
    box.appendChild(div);
  }
}

async function logout() {
  await call('/logout', {});
  show('screen-start');
}
</script>
</body>
</html>
