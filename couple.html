<style>
:root{--ink:#6b3a4e;--bg1:#fdeef3;--bg2:#f0e7fb;--card:#ffffffb8;--acc:#e0749c;--hand:"Marck Script","Segoe Script","Brush Script MT",cursive}
html[data-t="night"]{--ink:#f7e4ee;--bg1:#241a3a;--bg2:#3a2147;--card:#ffffff18;--acc:#f291b4}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:var(--hand);font-size:20px;color:var(--ink);background:linear-gradient(165deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html[data-t="night"] body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(1.5px 1.5px at 12% 18%,#fff9,transparent),radial-gradient(1.5px 1.5px at 70% 12%,#fff9,transparent),radial-gradient(2px 2px at 88% 40%,#fff8,transparent),radial-gradient(1.5px 1.5px at 30% 70%,#fff8,transparent),radial-gradient(2px 2px at 55% 88%,#fff7,transparent),radial-gradient(1.5px 1.5px at 8% 92%,#fff8,transparent)}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;bottom:-40px;opacity:.4;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg);opacity:0}}
#tod{position:fixed;inset:0;z-index:-3;pointer-events:none;transition:background 2s}
#tod.dawn{background:linear-gradient(#ffd6c9aa,#ffe9f244 45%,transparent 80%)}
#tod.dusk{background:linear-gradient(#ff9a8b44,#c9a0ff33 60%,transparent)}
#tod.night{background:radial-gradient(ellipse at 50% 0%,transparent 30%,#0c092066 100%)}
#tod.night::before{content:"";position:absolute;inset:0;opacity:.7;background:radial-gradient(1.5px 1.5px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 60% 15%,#fff8,transparent),radial-gradient(1.5px 1.5px at 80% 60%,#fff7,transparent),radial-gradient(1px 1px at 35% 80%,#fff8,transparent)}
#bigDays{position:fixed;left:0;right:0;top:42%;text-align:center;font-size:clamp(64px,20vw,150px);opacity:.07;pointer-events:none;z-index:-2;white-space:nowrap;display:none;color:var(--acc);font-family:var(--hand)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
header{position:relative;text-align:center;padding:30px 16px 4px}
h1{margin:0;font-size:clamp(38px,11vw,56px);font-weight:400;line-height:1.05}
header p{margin:6px 0 0;opacity:.75;font-size:22px}
.days{margin:12px auto 0;display:inline-block;padding:6px 18px;border-radius:999px;background:var(--card);font-size:22px}
.tools{position:relative;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 10px 4px}
.btn{font:inherit;font-size:21px;border:0;border-radius:999px;padding:9px 24px;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 4px 14px #e0749c55;position:relative;overflow:hidden;transition:scale .25s,box-shadow .3s}
.btn:hover{scale:1.05}.btn:active{scale:.96}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:none}
.grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:22px 16px;max-width:620px;margin:20px auto 60px;padding:0 18px}
.env{position:relative;aspect-ratio:4/3;cursor:pointer;filter:drop-shadow(0 8px 12px #8a4a6a38);transition:transform .25s,scale .35s,rotate .35s;animation:float 6s ease-in-out infinite,fadeIn .9s ease both}
.env:nth-child(2n){animation-delay:-2s,0s}.env:nth-child(3n){animation-delay:-4s,0s}
@keyframes float{50%{transform:translateY(-4px) rotate(.6deg)}}
@keyframes fadeIn{from{opacity:0;filter:blur(4px)}}
.env:active{transform:scale(.97)}
.env:hover{scale:1.04;rotate:-1.2deg}
.env:hover .seal{animation:wob .7s ease}
@keyframes wob{30%{rotate:-14deg}60%{rotate:10deg}}
.eb{position:absolute;inset:0;border-radius:8px;background:var(--c);overflow:hidden}
.eb::before{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,#fff6 50%,transparent 51%) left/50% 100% no-repeat,linear-gradient(to top left,transparent 49%,#fff6 50%,transparent 51%) right/50% 100% no-repeat}
.eb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 6px,#ffffff14 6px 7px)}
.ef{position:absolute;left:0;right:0;top:0;height:58%;background:var(--c2);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0;transform-origin:top;transition:transform .7s;box-shadow:0 2px 4px #0002}
.ef::after{content:"";position:absolute;inset:0;background:linear-gradient(#fff4,transparent 60%)}
.stamp{position:absolute;right:8px;bottom:8px;width:26px;height:30px;border:2px dashed #fff9;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#ffffff40;transform:rotate(5deg)}
.seal{position:absolute;left:50%;top:58%;width:42px;height:42px;margin:-21px 0 0 -21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a9e,#c42b4c 65%,#8f1a35);box-shadow:0 3px 6px #0005,inset 0 -2px 4px #0004;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:2}
.lbl{position:absolute;left:8px;right:44px;bottom:7px;font-size:16px;line-height:1.05;color:#5a2e41;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;z-index:2}
.badge{position:absolute;top:-8px;left:-6px;z-index:4;background:#fff;color:#d63a6a;border-radius:999px;padding:1px 10px;font-size:16px;box-shadow:0 2px 6px #0003;transform:rotate(-8deg);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{scale:1.12}}
.lock{position:absolute;inset:0;z-index:3;border-radius:8px;background:#3a2a4acc;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;text-align:center;padding:6px;line-height:1.1}
.lock b{font-size:28px;font-weight:400}
.env.shake{animation:shake .5s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.env.secret{grid-column:1/-1;aspect-ratio:auto;height:150px;--c:#ffe9a8;--c2:#f9c6d8;animation:glow 2.4s ease-in-out infinite;order:99}
.env.secret .eb{background:linear-gradient(135deg,#ffe9a8,#f9c6d8 55%,#e5d4ff);box-shadow:0 0 0 2px #fff9}
.env.secret .seal{background:radial-gradient(circle at 35% 30%,#ffe58a,#e0a82e 65%,#a87812)}
.env.secret::after{content:"✨";position:absolute;right:-6px;top:-14px;font-size:28px;animation:tw 1.4s infinite;z-index:5}
.env.secret .lbl{font-size:18px;right:50px;-webkit-line-clamp:4}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #ffc94d)}}
@keyframes tw{50%{transform:scale(1.4) rotate(20deg)}}
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:#2c1426c8;backdrop-filter:blur(5px)}
.ov.on{display:flex}
.stage{position:relative;width:min(300px,80vw);aspect-ratio:3/2;transform:scale(.4);opacity:0;transition:transform .7s,opacity .5s}
.ov.on .stage{transform:scale(1);opacity:1}
.stage.gone{transform:translateY(60vh) scale(.8);opacity:0;transition:all .9s}
.stage .env{height:100%;aspect-ratio:auto;pointer-events:none;animation:none;filter:none}
.stage.open .ef{transform:rotateX(180deg)}
.kiss{position:absolute;right:-22px;top:-30px;width:120px;z-index:6;pointer-events:none;animation:kissIn 1.6s ease both}
@keyframes kissIn{0%{opacity:0;scale:.4}30%{opacity:.95;scale:1.08}70%{opacity:.9;scale:1}100%{opacity:0;translate:0 -12px}}
.letter{position:fixed;left:50%;top:50%;width:min(92vw,470px);max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:none;flex-direction:column;background:#fffaf2;color:#5b3347;border-radius:6px;padding:20px 20px 14px;box-shadow:0 20px 60px #0006;transform:translate(-50%,-50%)}
.letter.on{display:flex;animation:paperOut 1.1s cubic-bezier(.2,.8,.2,1),bounce .6s 1.1s ease}
@keyframes paperOut{from{transform:translate(-50%,40%) scale(.5) rotate(-3deg);opacity:0}to{transform:translate(-50%,-50%) rotate(0);opacity:1}}
@keyframes bounce{40%{transform:translate(-50%,-53%)}70%{transform:translate(-50%,-49%)}}
.letter::before{content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;background:radial-gradient(#0000 55%,#8a6a4a22 100%),repeating-radial-gradient(circle at 20% 30%,#0000 0 3px,#8a6a4a08 3px 4px)}
.letter .wax{position:absolute;right:-8px;bottom:-10px;width:86px;height:80px;pointer-events:none;background:radial-gradient(ellipse at 45% 40%,#b5394f 0,#8f1a35 45%,transparent 72%);border-radius:45% 55% 50% 50%/55% 45% 55% 45%;opacity:.55;filter:blur(.6px);z-index:1}
.letter h2{margin:0 0 6px;font-weight:400;font-size:26px;text-align:center;line-height:1.1;animation:glowIn 1.2s ease both;position:relative;z-index:2}
@keyframes glowIn{from{opacity:0;letter-spacing:6px}}
.scr{overflow-y:auto;flex:1;min-height:0;position:relative;z-index:2}
.txt{font-size:23px;line-height:30px;white-space:pre-wrap;background:repeating-linear-gradient(transparent 0 29px,#efcfda 29px 30px);padding:0 2px;min-height:120px}
.sig{font-family:var(--hand);font-size:30px;text-align:right;color:#a33d62;margin:16px 6px 0;transform:rotate(-4deg);opacity:0;transition:opacity 1.2s .3s}
.sig.on{opacity:1}
.pics{display:flex;flex-direction:column;gap:20px;margin:22px 0 8px;align-items:center;opacity:0;transition:opacity 1.2s}
.pics.on{opacity:1}
.pics .pol{max-width:94%}
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 6px 18px;margin-top:14px;opacity:0;transition:opacity 1.2s;scrollbar-width:none}

.car.on{opacity:1}
.car .pol{flex:0 0 78%;scroll-snap-align:center;margin:0}

.lb{position:fixed;inset:0;z-index:40;background:#000e;display:none;align-items:center;justify-content:center;padding:10px}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
.lb .cap{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-size:20px}
.txt span{opacity:0;transition:opacity .5s}.txt span.on{opacity:1}
.letter.secret{background:linear-gradient(160deg,#fff7df,#ffe3ee 60%,#efe3ff);box-shadow:0 0 50px #ffd36b,0 20px 60px #0006}
.hug{height:70px;position:relative;font-size:40px;margin-bottom:4px}
.hug span{position:absolute;top:10px;transition:all 1.6s}
.hug .l{left:18%}.hug .r{right:18%}
.hug.on .l{left:calc(50% - 40px)}.hug.on .r{right:calc(50% - 40px)}
.hug .h{left:50%;top:-6px;transform:translateX(-50%) scale(0);opacity:0;font-size:30px}
.hug.on .h{transform:translateX(-50%) scale(1);opacity:1;transition-delay:1.4s}
.foot{text-align:center;margin-top:10px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}
.fall{position:fixed;top:-30px;z-index:30;pointer-events:none;animation:fall linear forwards;will-change:transform}
@keyframes fall{to{transform:translateY(110vh) rotate(40deg)}}
.flip{display:inline-block;animation:flipIn .6s both}
@keyframes flipIn{from{transform:rotateX(-90deg);opacity:0}}
#hugov{position:fixed;inset:0;z-index:56;display:none;background:#2c1426b8;backdrop-filter:blur(4px)}
#hugov.on{display:block}
#hugov .pp{position:absolute;top:40%;font-size:96px;transform:translateY(-50%)}
#hugov.on .a{animation:hugA 1.4s cubic-bezier(.2,.8,.2,1) both}
#hugov.on .b{animation:hugB 1.4s cubic-bezier(.2,.8,.2,1) both}
#hugov .hh{position:absolute;top:40%;left:50%;font-size:70px;opacity:0;transform:translate(-50%,-50%) scale(0)}
#hugov.on .hh{animation:hugH .8s 1.3s ease both}
@keyframes hugA{from{left:-30%}to{left:calc(50% - 96px)}}
@keyframes hugB{from{right:-30%}to{right:calc(50% - 96px)}}
@keyframes hugH{to{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
.gate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:linear-gradient(165deg,var(--bg1),var(--bg2));padding:20px;text-align:center}
.gate.on{display:flex}
.gate input{font:inherit;font-size:30px;text-align:center;width:200px;letter-spacing:8px;border:2px solid var(--acc);border-radius:16px;padding:8px;background:var(--card);color:var(--ink)}
.gate small{color:#d63a6a;min-height:24px}
.lg{font:inherit;font-size:22px;width:280px;max-width:86vw;padding:10px 14px;border:2px solid var(--acc);border-radius:14px;background:var(--card);color:var(--ink);transition:box-shadow .3s,border-color .3s}
.lg:focus{outline:none;box-shadow:0 0 0 4px var(--acc)44}
#login>div:first-child{animation:bloom 2.4s ease-in-out infinite}
@keyframes bloom{50%{transform:scale(1.15) rotate(-6deg)}}
#mus{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;display:none;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:20px}
#out{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:none;border:0;border-radius:999px;background:var(--card);color:var(--ink);padding:6px 14px;font:inherit;font-size:16px;cursor:pointer}
.err{text-align:center;padding:40px}
#thm{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:19px;cursor:pointer}
#snd{position:fixed;right:14px;top:calc(62px + env(safe-area-inset-top,0px));z-index:5;width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:18px;cursor:pointer}
.meet{margin:8px auto 0;display:none;padding:5px 16px;border-radius:999px;background:var(--card);font-size:21px}
.nav{position:relative;display:flex;gap:8px;overflow-x:auto;padding:6px 14px 2px;margin:8px auto 0;max-width:660px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:19px;border:0;border-radius:999px;padding:7px 16px;background:var(--card);color:var(--ink);cursor:pointer;position:relative;overflow:hidden;transition:scale .25s,box-shadow .3s}
.chip:hover{scale:1.05}
.chip.on{background:var(--acc);color:#fff;box-shadow:0 0 18px var(--acc)}
.view{position:relative;max-width:620px;margin:0 auto;padding:6px 18px 60px}
.view .grid{margin:14px 0 0;padding:0}
.pol{margin:0;background:#fff;padding:8px 8px 24px;box-shadow:0 6px 16px #0003;transform:rotate(var(--r,-2deg));cursor:zoom-in;color:#5b3347}
.pol img{display:block;width:100%;max-height:55vh;object-fit:cover}
.tl{position:relative;margin:16px 0 0 10px;padding-left:22px;border-left:3px dotted var(--acc)}
.tli{position:relative;margin-bottom:22px}
.tli i{position:absolute;left:-31px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--card)}
.tlc{background:var(--card);border-radius:16px;padding:12px 14px;transition:translate .3s,box-shadow .3s}

.tlc .pol{margin-top:10px}
.cp{display:flex;align-items:center;gap:12px;background:var(--card);border:2px dashed var(--acc);border-radius:16px;padding:14px;margin:14px 0;position:relative;transition:translate .3s,box-shadow .3s}
.cp:hover{translate:0 -3px;box-shadow:0 10px 24px #0002}
.cp .e{font-size:38px}.cp b{display:block;font-weight:400;font-size:25px;line-height:1.1}.cp p{margin:2px 0 0;opacity:.8;font-size:18px}
.cp.used{opacity:.5;filter:grayscale(.6)}
.cp.used::after{content:"использовано ✓";position:absolute;right:10px;top:8px;transform:rotate(-8deg);border:2px solid var(--acc);border-radius:6px;padding:0 8px;font-size:16px}
.todo{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin:10px 0;cursor:pointer;font-size:21px;transition:translate .3s,box-shadow .3s}
.todo:hover{translate:0 -3px;box-shadow:0 10px 24px #0002}
.todo u{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--acc);text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:16px}
.todo.done u{background:var(--acc);color:#fff}.todo.done span{text-decoration:line-through;opacity:.6}
.prog{height:12px;border-radius:99px;background:var(--card);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--acc);transition:width .6s}
.alb{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}

.alb figcaption{text-align:center;font-size:17px;margin-top:4px}
.qz{text-align:center;padding-top:10px}.qz h2{font-weight:400;font-size:30px;line-height:1.15;margin:8px 0 16px}
.opt{display:block;width:100%;font:inherit;font-size:21px;color:var(--ink);background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px;margin:10px 0;cursor:pointer}

.row3{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ow:'+s)))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function rpc(fn,args){
  const a={...(args||{})};delete a.p_token;delete a.p_device;
  if(fn==='login_couple'){const d=await post('/login',{login:a.p_login,password:a.p_password});return [{session_token:'cookie',admin_flag:!!d.isAdmin}]}
  if(fn==='logout_couple')return post('/logout',{});
  return post('/rpc/'+fn,a);
}
const call=(fn,args={})=>rpc(fn,args);

let SND=ls.get('ow_snd')!==false;
function tone(f,d,t=0,type='sine',g=.05){
  if(!SND)return;
  try{
    const a=window._ac||(window._ac=new (window.AudioContext||window.webkitAudioContext)());
    const o=a.createOscillator(),v=a.createGain();
    o.type=type;o.frequency.value=f;o.connect(v);v.connect(a.destination);
    const s=a.currentTime+t;
    v.gain.setValueAtTime(g,s);v.gain.exponentialRampToValueAtTime(.0001,s+d);
    o.start(s);o.stop(s+d);
  }catch(e){}
}

function bindPad(v){const c=v.querySelector('#pad');if(!c)return;const box=c.parentElement,W=box.clientWidth,H=box.clientHeight;
 c.width=W*devicePixelRatio;c.height=H*devicePixelRatio;const x=c.getContext('2d');x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#e0749c';
 let pts=[],down=false;
 const pos=e=>{const b=c.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top}};
 c.onpointerdown=e=>{down=true;pts=[pos(e)];x.clearRect(0,0,W,H);c.setPointerCapture(e.pointerId)};
 c.onpointermove=e=>{if(!down)return;const p=pos(e),q=pts[pts.length-1];x.beginPath();x.moveTo(q.x,q.y);x.lineTo(p.x,p.y);x.stroke();pts.push(p)};
 const end=()=>{if(!down)return;down=false;
   let len=0;for(let i=1;i<pts.length;i++)len+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
   const a=pts[0],b=pts[pts.length-1];
   const closed=pts.length>10&&Math.hypot(a.x-b.x,a.y-b.y)<50&&len>160;
   if(closed){hearts(40);track('gesture',null,'сердечко ✍️');$('padT').textContent='Сердечко! 💗'}
   else{$('padT').textContent='Нарисуй сердечко пальцем 💗'}
   setTimeout(()=>x.clearRect(0,0,W,H),900)};
 c.onpointerup=end;c.onpointerleave=end;
}

  v.querySelectorAll('.cp').forEach(c=>c.querySelector('button').onclick=()=>{const id=c.dataset.id,t=c.querySelector('b').textContent,u=ls.get('ow_used')||[];u.push(id);ls.set('ow_used',u);hearts(20);c.style.transition='all .5s';c.style.opacity=0;c.style.transform='translateX(60px)';
   undoSnack('Купон «'+t+'» использован',()=>{ls.set('ow_used',(ls.get('ow_used')||[]).filter(z=>z!==id));if(curView==='coupons')show('coupons')},()=>track('coupon',null,t));setTimeout(()=>{if(curView==='coupons'&&c.isConnected)show('coupons')},520)})},
 todo(v){const loc=ls.get('ow_todo')||[];const dn=cfg.checklist.filter((x,i)=>x.done||loc.includes(x.id||'t'+i)).length;
  v.innerHTML=`<div style="text-align:center;font-size:22px;margin-top:10px">Сделано ${dn} из ${cfg.checklist.length}</div><div class="prog"><i style="width:${Math.round(dn/cfg.checklist.length*100)}%"></i></div>`+cfg.checklist.map((x,i)=>{const id=x.id||'t'+i;const d=x.done||loc.includes(id);return `<div class="todo ${d?'done':''}" data-id="${esc(id)}" data-a="${x.done?1:0}"><u>${d?'✓':''}</u><span>${esc(x.text)}</span></div>`}).join('');

 album(v){v.innerHTML='<div class="alb">'+cfg.gallery.map(x=>`<figure><img src="${esc(x.photo)}" data-lb data-cap="${esc(x.caption||'')}" loading="lazy" alt="">${x.caption?`<figcaption>${esc(x.caption)}</figcaption>`:''}</figure>`).join('')+'</div>'},
 quiz(v){const Q=cfg.quiz;let i=0,sc=0;const step=()=>{
   if(i>=Q.length){if(!Q.done){Q.done=1;track('quiz',null,sc+'/'+Q.length);stSet(s=>{s.quiz=sc+'/'+Q.length})}v.innerHTML=`<div class="qz"><div style="font-size:54px">🏆</div><h2>Правильно: ${sc} из ${Q.length}</h2><p style="font-size:23px">${esc(cfg.quizEnd||'Ты у меня самая лучшая 💗')}</p><button class="btn" id="qr">Ещё раз</button></div>`;$('qr').onclick=()=>{i=0;sc=0;step()};if(sc===Q.length)hearts(40);return}
   const q=Q[i];v.innerHTML=`<div class="qz"><small>Вопрос ${i+1} из ${Q.length}</small><h2>${esc(q.q)}</h2>${(q.options||[]).map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>`;
   v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,c=(+q.answer||1)-1;v.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===c)x.classList.add('ok')});if(k===c){sc++;sfx.burst()}else{b.classList.add('no');sfx.err()}setTimeout(()=>{i++;step()},1100)})};step()},
 async qa(v){const Q=cfg.questions;
  v.innerHTML='<div class="qz qa"><div id="qab">Загружаю…</div></div>';
  let D={};try{const rows=await call('qa_get');rows.forEach(r=>{(D[r.out_qid]=D[r.out_qid]||{})[r.out_who]={text:r.out_text,t:r.out_at}})}catch(e){const x=$('qab');x&&(x.innerHTML='<p>Не получается связаться с базой 😢</p>');return}
  const box=$('qab');if(!box)return;
  const cur=Q.find(x=>!(D[qid(x)]&&D[qid(x)].her)),done=Q.filter(x=>D[qid(x)]&&D[qid(x)].her).reverse();let h='';
  if(cur)h+=`<small>Вопрос</small><h2>${esc(cur.q)}</h2><textarea id="qat" placeholder="Твой ответ…"></textarea><br><button class="btn" id="qas" style="margin-top:8px">Отправить</button><div id="qerr" style="min-height:26px"></div>`;
  else h+='<p style="font-size:24px">Ты ответила на все вопросы 💗<br>Скоро появятся новые</p>';
  if(done.length)h+='<h3 style="font-weight:400;font-size:26px;margin:22px 0 4px">Ваши ответы</h3>'+done.map(x=>{const a=D[qid(x)];return `<div class="qab"><small>${esc(x.q)}</small><br>Ты: ${esc(a.her.text)}<br>${a.him?'Он: '+esc(a.him.text):'<small>Он ещё не ответил 💞</small>'}</div>`}).join('');
  box.innerHTML=h;
  const s=$('qas');s&&(s.onclick=async()=>{const t=$('qat').value.trim();if(!t)return;s.disabled=true;
   try{await call('qa_put',{p_qid:qid(cur),p_who:'her',p_text:t});track('qa',null,cur.q+' → '+t);hearts(15);V.qa(v)}
   catch(e){s.disabled=false;$('qerr').textContent='Не отправилось 😢 Попробуй ещё раз'}})},
 wheel(v){const I=cfg.dates.map(x=>x.text),n=I.length;v.innerHTML='<div class="whl"><div class="pt">▼</div><canvas id="wc" width="640" height="640"></canvas></div><div style="text-align:center"><button class="btn" id="spin">Крутить 🎡</button><p id="wres" style="font-size:28px;min-height:40px"></p></div>';
  const c=$('wc'),x=c.getContext('2d'),seg=2*Math.PI/n,cols=['#fbd3de','#e4d9fa','#ffe7c9','#d3eee3','#cfd9f5','#fcd5e8'];
  for(let k=0;k<n;k++){x.beginPath();x.moveTo(320,320);x.arc(320,320,316,-Math.PI/2+k*seg,-Math.PI/2+(k+1)*seg);x.closePath();x.fillStyle=cols[k%cols.length];x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
   x.save();x.translate(320,320);x.rotate(-Math.PI/2+(k+.5)*seg);x.fillStyle='#5b3347';x.font='30px "Marck Script",cursive';x.textAlign='right';x.fillText(I[k].slice(0,20),296,10);x.restore()}
  let rot=0,busy=false;$('spin').onclick=()=>{if(busy)return;busy=true;$('wres').textContent='';const i=Math.floor(Math.random()*n),sd=360/n,target=((-(i+.5)*sd)%360+360)%360,cur=((rot%360)+360)%360;rot+=360*6+((target-cur)+360)%360;c.style.transform=`rotate(${rot}deg)`;
   setTimeout(()=>{busy=false;$('wres').textContent='🎉 '+I[i];track('roulette',null,I[i]);hearts(25)},4700)}},
 quest(v){const Q=cfg.quest,p=ls.get('ow_quest')||0,norm=s=>String(s).toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
  v.innerHTML=Q.map((x,i)=>i<p?`<div class="qst"><small>Шаг ${i+1} ✓</small><p>${esc(x.riddle)}</p><p style="font-size:24px">${esc(x.hint||'')}</p></div>`:i===p?`<div class="qst"><small>Шаг ${i+1} из ${Q.length}</small><p>${esc(x.riddle)}</p><input id="qin" placeholder="Твой ответ"><button class="btn" id="qgo">Проверить</button><div id="qm" style="min-height:26px"></div></div>`:`<div class="qst lock">🔒 Шаг ${i+1}</div>`).join('')+(p>=Q.length?'<div style="text-align:center;font-size:30px">🎁 Квест пройден!</div>':'');
  const b=$('qgo');b&&(b.onclick=()=>{const a=norm($('qin').value);if(a&&String(Q[p].answer).split('|').some(z=>norm(z)===a)){ls.set('ow_quest',p+1);track('quest',null,`шаг ${p+1} из ${Q.length} пройден`);hearts(30);show('quest')}else{$('qm').textContent='Хм, не угадала. Подумай ещё 💭';sfx.err()}})},
 scratch(v){v.innerHTML=cfg.scratch.map((x,i)=>`<div class="sc"><b>${esc(x.title||'')}</b><p>${esc(x.text||'')}</p><canvas data-i="${i}"></canvas></div>`).join('');
  v.querySelectorAll('canvas').forEach(c=>{const x=cfg.scratch[+c.dataset.i];scratchInit(c,()=>{hearts(20);track('scratch',null,x.title||'карта')})})},
 puzzle(v){v.innerHTML=cfg.puzzle.map((x,i)=>`<div><div class="pz" id="pz${i}"></div></div>`).join('');cfg.puzzle.forEach((x,i)=>{if(x.photo)slide($('pz'+i),x.photo,x.text)})},
 map(v){v.innerHTML='<div id="map"></div>';const go=()=>{const m=L.map('map').setView([30,10],2);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);const pts=[];
   cfg.places.forEach(p=>{const c=String(p.coords||'').split(/[,;\s]+/).filter(Boolean).map(Number);if(c.length<2||c.some(isNaN))return;const ll=c.slice(0,2);pts.push(ll);L.marker(ll,{icon:L.divIcon({html:'<div style="font-size:30px;line-height:30px">📍</div>',className:'',iconSize:[30,30],iconAnchor:[15,30]})}).addTo(m).bindPopup(`<b>${esc(p.title||'')}</b><br>${esc(p.text||'')}${p.photo?`<br><img src="${esc(p.photo)}" style="width:180px;border-radius:8px;margin-top:6px">`:''}`)});pts.length&&m.fitBounds(pts,{maxZoom:14,padding:[30,30]})};
  if(window.L)go();else{const css=document.createElement('link');css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(css);const s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.onload=go;document.head.appendChild(s)}},
 year(v){const s=ls.get('ow_stats')||{},rx=s.rx||{},top=Object.keys(rx).sort((a,b)=>rx[b]-rx[a])[0],days=Math.floor((Date.now()-new Date(cfg.startDate+'T00:00:00'))/864e5),todo=(ls.get('ow_todo')||[]).length+cfg.checklist.filter(x=>x.done).length;
  const C=[[days,'дней вместе'],[(ls.get('ow_read')||[]).length+' из '+letters.length,'писем открыто'],[top||'—','любимая реакция'],[s.replies||0,'ответов отправлено'],[(ls.get('ow_used')||[]).length,'купонов использовано'],[todo,'мечт сбылось'],[s.quiz||'—','результат квиза'],[ls.get('ow_quest')||0,'шагов квеста пройдено']];
  v.innerHTML='<div style="text-align:center;font-size:32px;margin-top:10px">Наш год ✨</div><div class="yr">'+C.map(c=>`<div><b>${esc(c[0])}</b>${c[1]}</div>`).join('')+'</div>'},
 music(v){v.innerHTML=cfg.playlist.map((x,i)=>{const e=ymEmbed(x.url);return `<div class="song"><span style="font-size:28px">🎵</span><div><b>${esc(x.title)}</b><small>${esc(x.artist||'')}</small></div>${e?`<button class="btn" data-i="${i}">▶ Слушать</button>`:(x.url?`<a class="btn" href="${esc(x.url)}" target="_blank" rel="noopener">Слушать</a>`:'')}</div><div class="plr" id="plr${i}"></div>`}).join('');
  v.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,box=$('plr'+i),e=ymEmbed(cfg.playlist[i].url);if(box.innerHTML){box.innerHTML='';b.textContent='▶ Слушать';return}
   box.innerHTML=`<iframe src="${esc(e.src)}" frameborder="0" allow="autoplay; encrypted-media" style="border:none;width:100%;height:${e.h}px;border-radius:12px" loading="lazy"></iframe>${e.open?`<a class="ya" href="${esc(e.open)}" target="_blank" rel="noopener">Открыть в Яндекс Музыке ↗</a>`:''}`;b.textContent='✕ Закрыть'})}

function holiday(){const now=new Date(),md=(now.getMonth()+1)+'-'+now.getDate(),key='ow_h_'+now.toDateString();if(ls.get(key))return;
 const L=(cfg.holidays||[]).filter(x=>x.date&&mdOf(x.date)===md).map(x=>({e:x.emoji||'🎉',t:x.title||'',x:x.text||''}));
 if(cfg.startDate&&mdOf(cfg.startDate)===md){const y=now.getFullYear()-new Date(cfg.startDate+'T00:00:00').getFullYear();if(y>=1)L.push({e:'💞',t:`Нам ${y} ${yw(y)}!`,x:'С годовщиной, моя любимая.'})}
 if(!L.length)return;const x=L[0];$('hE').textContent=x.e;$('hT').textContent=x.t;$('hX').textContent=x.x;$('hol').classList.add('on');hearts(80);$('hB').onclick=()=>{$('hol').classList.remove('on');ls.set(key,1)}}

function renderLetters(){const g=$('grid');if(!g)return;g.innerHTML='';const read=ls.get('ow_read')||[];
 letters.forEach(l=>{const sec=l.type==='secret',lk=isLocked(l),d=document.createElement('div');
  d.className='env'+(sec?' secret':'');d.style.cssText=`--c:${l.c||'#fbd3de'};--c2:${l.c2||'#f4b6c8'}`;
  const left=lk?Math.ceil((unlockAt(l)-new Date())/864e5):0;
  d.innerHTML=envInner(l)+(lk?`<div class="lock"><b>🔒</b>откроется ${ruDate(unlockAt(l))}<br>через ${left} ${plural(left)}</div>`:'')+((!lk&&!read.includes(l.id))?'<div class="badge">новое</div>':'');
  d.onclick=()=>{if(lk){sfx.err();d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');return}open(l)};
  if(l.secretMsg&&!lk){const sl=d.querySelector('.seal');let taps=0,tm;sl.onclick=e=>{e.stopPropagation();taps++;clearTimeout(tm);if(taps>=5){taps=0;secretShow(l);return}tm=setTimeout(()=>{taps=0;d.click()},700)}}
  g.appendChild(d)})}
const envLabel=l=>{if(l.type==='secret')return l.title;const t=l.title.replace(/^Открой,?\s*/i,'');return t.charAt(0).toUpperCase()+t.slice(1)};
function envInner(l){return `<div class="eb"></div><div class="ef"></div><div class="stamp">♡</div><div class="seal">${esc(l.emoji)}</div><div class="lbl">${esc(envLabel(l))}</div>`}
const KISS='<svg class="kiss" viewBox="0 0 120 60"><path d="M6 30 Q28 4 60 18 Q92 4 114 30 Q92 58 60 46 Q28 58 6 30Z" fill="#c2185b" opacity=".9"/><path d="M60 18 L60 46" stroke="#8c0f3d" stroke-width="2" opacity=".6"/></svg>';
function secretShow(l){$('hE').textContent='🤫';$('hT').textContent='Секрет';$('hX').textContent=l.secretMsg;$('hol').classList.add('on');hearts(30);track('secret',l,'нашла секрет');$('hB').onclick=()=>$('hol').classList.remove('on')}

$('today').onclick=()=>{const ok=letters.filter(l=>l.type!=='secret'&&!isLocked(l));if(!ok.length)return;const d=new Date();const k=d.getFullYear()*372+d.getMonth()*31+d.getDate();open(ok[k%ok.length])};

function open(l){track('open',l);sfx.open();clearInterval(timer);const st=$('stage'),lt=$('letter');
 st.className='stage';st.innerHTML=`<div class="env ${l.type==='secret'?'secret':''}" style="--c:${l.c||'#fbd3de'};--c2:${l.c2||'#f4b6c8'}">${envInner(l)}</div>`;
 if(!(ls.get('ow_read')||[]).includes(l.id))st.insertAdjacentHTML('beforeend',KISS);
 lt.className='letter';lt.innerHTML='';$('ov').classList.add('on');
 setTimeout(()=>st.classList.add('open'),800);
 setTimeout(()=>{build(l);lt.classList.add('on');st.classList.add('gone')},1500)}

function build(l){const lt=$('letter'),sec=l.type==='secret';lt.classList.toggle('secret',sec);lt.className=lt.className.replace(/\bwc-\S+/g,'').trim();if(l.bg&&!sec)lt.classList.add('wc-'+l.bg);
 const words=l.text.split(/(\s+)/).map(w=>/^\s+$/.test(w)||!w?w:`<span>${esc(w)}</span>`).join('');
 const ph=l.photos||[];
 const pics=ph.length>1?`<div class="car" id="pics">${ph.map((p,k)=>`<figure class="pol" style="--r:${k%2?2:-2}deg"><img src="${esc(p)}" alt="" loading="lazy"></figure>`).join('')}</div>`:ph.length?`<div class="pics" id="pics">${ph.map(p=>`<figure class="pol"><img src="${esc(p)}" alt="" loading="lazy"></figure>`).join('')}</div>`:'';
 lt.innerHTML=`<div class="wax"></div><h2>${esc(l.emoji)} ${esc(l.title)}</h2>${l.type==='hug'?'<div class="hug"><span class="l">🧍</span><span class="r">🧍</span><span class="h">💞</span></div>':''}<div class="scr" id="scr"><div class="txt" id="txt">${words}</div>${pics}<div class="sig" id="sig">${esc(cfg.signature||'— с любовью 💗')}</div>${FB}</div><div class="foot" id="foot" style="visibility:hidden">${l.audio?'<button class="btn ghost" id="au">▶ Послушать</button>':''}<button class="btn" id="cl">Закрыть письмо</button></div>`;
 const hg=lt.querySelector('.hug');hg&&setTimeout(()=>hg.classList.add('on'),400);
 if(l.audio){const a=new Audio(l.audio);$('au').onclick=()=>{a.paused?a.play():a.pause()};lt._a=a}
 $('cl').onclick=close;bindFb(l);
 const sp=[...lt.querySelectorAll('.txt span')];let i=0;
 const done=()=>{if(done.f)return;done.f=1;track('read',l);const fb=$('fb');fb&&(fb.style.display='block');clearInterval(timer);sp.forEach(s=>s.classList.add('on'));$('foot').style.visibility='visible';const pc=$('pics');pc&&pc.classList.add('on');$('sig')&&$('sig').classList.add('on');const r=ls.get('ow_read')||[];if(!r.includes(l.id)){r.push(l.id);ls.set('ow_read',r)}if(sec)hearts(70)};
 timer=setInterval(()=>{if(i>=sp.length){done();return}sp[i].classList.add('on');const t=$('scr');t.scrollTop=t.scrollHeight;i++},hg?70:55);
 $('txt').onclick=done;lt.querySelectorAll('#pics img').forEach(im=>im.onclick=()=>{$('lbi').src=im.src;$('lbc').textContent='';$('lb').classList.add('on')})}

function close(){clearInterval(timer);const lt=$('letter');lt._a&&lt._a.pause();$('ov').classList.remove('on');lt.className='letter';lt.innerHTML='';renderLetters()}

function hearts(n){
  const E=['💖','💗','💕','💘','✨','🎉','🌸','🎊'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='fall';
    s.textContent=E[i%E.length];
    s.style.cssText=`left:${Math.random()*100}vw;font-size:${14+Math.random()*24}px;animation-duration:${2.8+Math.random()*3}s;animation-delay:${Math.random()*1.2}s;transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),7000);
  }
  sfx.burst();
}

$('lb').onclick=()=>$('lb').classList.remove('on');

/* ---------- кнопка звука ---------- */
const sb=document.createElement('button');
sb.id='snd';
const paintSnd=()=>sb.textContent=SND?'🔔':'🔕';
paintSnd();

/* ---------- эффекты кнопок и курсора ---------- */
(()=>{
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 document.addEventListener('click',e=>{
  const b=e.target.closest('.btn,.chip,.opt,.mood button,.rx button');
  if(!b||reduce)return;
  const r=b.getBoundingClientRect(),s=document.createElement('span'),d=Math.max(r.width,r.height);
  s.className='ripple';
  s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  b.appendChild(s);setTimeout(()=>s.remove(),650);
 });
 let last=0;
 document.addEventListener('pointermove',e=>{
  if(reduce||e.pointerType==='touch')return;
  const n=Date.now();if(n-last<70)return;last=n;
  const s=document.createElement('i');
  s.className='spark';s.textContent=['✦','✧','♡'][n%3];
  s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),900);
 });
})();

init();
